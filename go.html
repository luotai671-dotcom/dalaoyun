<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="referrer" content="no-referrer"><title>正在安全跳转｜大佬云</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b0f;color:#eef2f4;font-family:system-ui,"Microsoft YaHei",sans-serif}.box{width:min(420px,calc(100% - 40px));border:1px solid #29323b;padding:40px;text-align:center;background:#0e1319}.mark{display:grid;place-items:center;margin:auto;width:50px;height:50px;background:#ffc62e;color:#111;font-weight:900;font-size:27px}.loader{height:2px;background:#252c33;margin:28px 0;overflow:hidden}.loader i{display:block;height:100%;width:45%;background:#ffc62e;animation:load 1.2s infinite}@keyframes load{to{transform:translateX(230%)}}p{color:#8f9aa3;font-size:14px}a{color:#ffc62e}</style></head><body><main class="box"><div class="mark">D</div><h1>正在安全跳转</h1><p id="message">正在验证目标地址，请稍候。</p><div class="loader"><i></i></div><a href="index.html">返回大佬云首页</a></main><script src="go-targets.js"></script><script>(()=>{const targets=window.GO_TARGETS||{};const params=new URLSearchParams(location.search);const key=params.get('target');const campaign=params.get('id');const url=(campaign&&targets[campaign])||targets[key];if(!url){document.querySelector('#message').textContent='目标地址无效或不在安全白名单中。';document.querySelector('.loader').hidden=true;return}setTimeout(()=>location.replace(url),700)})();</script></body></html>
